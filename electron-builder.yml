appId: com.loomix.pos
productName: Loomix
directories:
  output: dist
  buildResources: build
files:
  - dist
  - dist-electron
  - build
  - node_modules
  - package.json
asar: true
asarUnpack:
  - "**/*.node"
  - node_modules/better-sqlite3
win:
  target: nsis
  icon: build/icon.ico
  artifactName: "${productName}-Setup-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: "Loomix"
